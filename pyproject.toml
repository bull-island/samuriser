[project]
name = "samuriser"
version = "0.1.0"
description = "Shorten long videos by cutting padding and repetition while keeping the original footage."
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=2.6.0",
    "boto3>=1.44.3",
    "fastapi>=0.162.2",
    "mlx-whisper>=0.4.3",
    "numpy>=2.4.6",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    "yt-dlp[curl-cffi,default]>=2026.10.26",
]

[project.scripts]
shorten = "samuriser.cli:main"
samuriser = "samuriser.web:main"
publish = "samuriser.web:publish_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samuriser"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["boto3", "mlx_whisper", "yt_dlp"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
