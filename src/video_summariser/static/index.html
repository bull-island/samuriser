<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Summariser</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="page">
    <h1>Video Summariser</h1>

    <section class="panel">
      <label for="links">Video or article links, one per line</label>
      <textarea id="links" rows="3" placeholder="https://…"></textarea>
      <div class="actions">
        <button class="primary" data-kind="check">Is it worth my time?</button>
        <button data-kind="shorten">Shorten it</button>
        <button data-kind="watched">I've already seen these</button>
      </div>
      <p id="add-message" class="muted" role="status"></p>
    </section>

    <input id="search" type="search" placeholder="Search everything you've added" aria-label="Search">
    <section id="results" class="results"></section>

    <section id="jobs"></section>
    <div class="tabs">
      <div id="views" class="segmented" role="group" aria-label="View"></div>
      <div id="platforms" class="segmented" role="group" aria-label="Platform"></div>
    </div>
    <section id="videos" class="videos"></section>
  </main>
  <script type="module" src="/static/library.js"></script>
</body>
</html>
